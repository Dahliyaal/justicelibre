<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JusticeLibre — hub (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--teal:#1a4e4e;--teal-l:#2a6b6b;--teal-xl:#e8f0f0;--ink:#1a1a1a;--muted:#6b6b6b;--white:#fff;--line:#e0ddd6;--cream:#fdfcf8;--warn-bg:#fbf1dc;--warn:#8a5a12;--bad-bg:#fbe3e0;--bad:#8a2a1f;--ok:#1f6f4a;
 --jud:#2f5d8a;--adm:#7a5c1e;--ce:#1f6f4a;--eu:#6d3e8c;--txt:#8a4a1f;--doc:#4e5a8c}
@media (prefers-color-scheme:dark){:root{--teal:#4ea0a0;--teal-l:#66baba;--teal-xl:#1e3a3a;--ink:#e8e6df;--muted:#8a867d;--white:#1e1e1c;--line:#2a2a27;--cream:#1a1a1a;--warn-bg:#3a2e14;--warn:#e0b060;--bad-bg:#3d1c18;--bad:#f0a090;--ok:#6fc29a;--jud:#7fa6d6;--adm:#c9a55c;--ce:#6fc29a;--eu:#b98ad6;--txt:#d6905c;--doc:#93a0d6}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--cream)}
a{color:var(--teal);text-decoration:none}a:hover{color:var(--teal-l);text-decoration:underline}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.h5{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ── structure ── */
.top{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;border-bottom:1px solid var(--line);background:var(--white);position:sticky;top:0;z-index:5}
.logo{font-family:"DM Serif Display",Georgia,serif;font-size:20px;color:var(--teal)}
.logo span{color:var(--muted)}
.nav{display:flex;gap:22px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav a{color:inherit}.nav a.on{color:var(--teal);font-weight:600}
.app{display:flex;min-height:calc(100% - 56px)}
.rail{width:248px;flex:none;border-right:1px solid var(--line);background:var(--white);padding:10px 8px 12px;display:flex;flex-direction:column;gap:1px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;transition:width .15s}
.rail.mini{width:60px}
.rail.mini .lbl,.rail.mini .n,.rail.mini .chev,.rail.mini .sub,.rail.mini .sec,.rail.mini .facets{display:none}
.rail .hd{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;color:var(--muted)}
.rail .sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.ri{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--ink);width:100%;text-align:left}
.ri:hover{background:var(--cream)}
.ri.on{background:var(--teal-xl);color:var(--teal);font-weight:600}
.ri svg{flex:none}
.ri .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);font-weight:400}
.ri .chev{margin-left:6px;color:var(--muted);font-size:12px;transition:transform .15s}
.ri.on .chev{transform:rotate(90deg)}
.subs{overflow:hidden}
.subs.opening{animation:unfold .22s ease-out}
.subs.closing{animation:fold .16s ease-in forwards}
@keyframes unfold{from{max-height:0;opacity:0;transform:translateY(-4px)}to{max-height:600px;opacity:1;transform:none}}
@keyframes fold{from{max-height:600px;opacity:1}to{max-height:0;opacity:0}}
.ri,.sub{transition:background .15s,color .15s}
.body>*{animation:appear .2s ease-out}
@keyframes appear{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.subs.opening,.subs.closing,.body>*{animation:none}}
.feed{max-width:1100px;margin:72px auto 0}
.feed-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-bottom:16px;font-family:"DM Serif Display",Georgia,serif;font-size:22px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:400}
.feed-h .s{font-family:"DM Sans",system-ui,sans-serif;font-size:13px;color:var(--muted)}

.cards{display:flex;flex-direction:column}
.card2{display:block;padding:15px 0;border-bottom:1px solid var(--line);color:inherit}
a.card2:hover{text-decoration:none}
.card2 .jour{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);white-space:nowrap}
.card2 .top2{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.card2 .top2 .qui{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card2 .ttl{font-family:"DM Serif Display",Georgia,serif;font-size:19px;line-height:1.2;color:var(--ink);margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
a.card2:hover .ttl{color:var(--teal)}
a.card2:hover .ttl{color:var(--teal)}
.card2 .res{font-size:13px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:105ch}
.card2 .res em{font-style:normal;background:var(--teal-xl);padding:0 2px}
.card2 .bas{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;font-size:11px;color:var(--muted)}

.sk{border-bottom:1px solid var(--line);padding:15px 0;opacity:.5}
.sk div{height:10px;border-radius:3px;background:var(--line);margin-bottom:8px;animation:pulse 1.2s ease-in-out infinite}
.sk div:nth-child(1){width:30%}.sk div:nth-child(2){width:56%;height:14px}.sk div:nth-child(3){width:88%}
.sk div:nth-child(4){width:64%}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.85}}
.feed-end{color:var(--muted);font-size:11.5px;padding:14px 0}
details.recent{max-width:880px;margin:22px auto 0;font-size:12.5px}
details.recent summary{cursor:pointer;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:6px;user-select:none}
details.recent summary::-webkit-details-marker{display:none}
details.recent summary b{font-weight:400;display:inline-block;transition:transform .15s}
details.recent[open] summary b{transform:rotate(180deg)}
details.recent summary:hover{color:var(--teal)}
details.recent .rec{font-size:12.5px;padding:6px 0}
.sub{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 38px;font-size:12.5px;color:var(--ink);border-radius:6px;width:100%;text-align:left}
.sub:hover{background:var(--cream)}
.sub.on{background:var(--cream);font-weight:600;color:var(--teal)}
.sub .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);font-weight:400}
.sub.soon{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.dot.soon{background:transparent;border:1px solid var(--muted)}
.body{flex:1;min-width:0;padding:32px 56px 80px}
@media (max-width:900px){.body{padding:20px 18px 80px}.rail{position:fixed;left:0;z-index:6;box-shadow:2px 0 12px rgba(0,0,0,.08)}.rail.mini{width:52px}}

/* ── éléments ── */
.hero{font-family:"DM Serif Display",Georgia,serif;font-size:30px;margin:0 0 4px}
.lead{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:80ch}
.sbar{display:flex;flex:1;border:1.5px solid var(--teal);border-radius:4px;background:var(--white);overflow:hidden;max-width:880px}
.sbar input{flex:1;padding:12px 16px;font-size:16px;border:0;outline:0;background:transparent;min-width:0}
.sbar input::placeholder{color:var(--muted)}
.sbar .go{background:var(--teal);color:#fff;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:0 22px}
.sbar .dt{border-left:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sbar .dt input{padding:4px 6px;font-size:13px;width:120px;font-family:"JetBrains Mono",monospace}
.kb{font-family:"JetBrains Mono",monospace;background:var(--teal-xl);padding:1px 6px;border-radius:3px;color:var(--ink);font-size:12px;cursor:pointer}
.kb:hover{background:var(--teal);color:#fff}
.hint{color:var(--muted);font-size:12.5px;margin-top:10px}
.vcenter{min-height:calc(100vh - 56px - 112px);display:flex;flex-direction:column;justify-content:center;padding-bottom:8vh}
.vcenter>*{width:100%}
.center{max-width:880px;margin:0 auto;text-align:center}
.center .hero{font-size:36px}
.center .lead{margin-left:auto;margin-right:auto}
.sbox{max-width:880px;margin:0 auto;text-align:left;flex:1;min-width:0}
.sbar .advt{border-left:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sbar .advt.on{color:var(--teal);background:var(--teal-xl)}
.sbar .advt b{display:inline-block;transition:transform .15s;font-weight:400}
.sbar .advt.on b{transform:rotate(180deg)}
.adv{background:var(--white);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:14px 16px 12px;max-width:880px;margin:0 auto}
.adv[hidden]{display:none}
.fams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fam{padding:0}
.fam .fh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink);background:var(--teal-xl);padding:7px 10px;border-radius:5px;margin-bottom:6px}
.fam .all{width:16px;height:16px;border:1.5px solid var(--teal);border-radius:3px;flex:none;position:relative;background:transparent}
.fam .all:hover{background:var(--white)}
.fam .all.on{background:var(--teal)}
.fam .all.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.fam .all.half::after{content:"";position:absolute;left:3px;right:3px;top:6px;height:2px;background:var(--teal)}
.fch{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:12.5px;padding:5px 8px;border-radius:4px;color:var(--ink)}
.fch:hover{background:var(--teal-xl)}
.fch i{width:13px;height:13px;border:1.5px solid var(--muted);border-radius:3px;flex:none;position:relative;box-sizing:border-box}
.fch.on i{background:var(--teal);border-color:var(--teal)}
.fch.on i::after{content:"";position:absolute;left:3px;top:0;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.fch.on{color:var(--teal);font-weight:600}
.fch .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted)}
.fch.soon{color:var(--muted);cursor:default;font-style:italic}.fch.soon i{border-style:dashed;opacity:.6}
.adv-row{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.quand-bloc{border-top:1px solid var(--line);padding-top:12px}
.adv-row .lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--cream);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.x{padding-right:7px}
.chip.add{border-style:dashed;color:var(--muted)}
.adv input.dt{font:inherit;font-family:"JetBrains Mono",monospace;font-size:12px;padding:4px 7px;width:104px;border:1px solid var(--line);border-radius:4px;background:var(--cream);color:var(--ink)}
.adv input.dt::placeholder{color:var(--muted);font-size:11px}
.adv input.dt.bad{border-color:var(--bad)}
.range{position:relative;height:50px;margin:6px 6px 0}
.range input[type=range]{position:absolute;left:0;right:0;top:8px;width:100%;margin:0;pointer-events:none;-webkit-appearance:none;appearance:none;background:transparent;height:20px}
.range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--white);border:2.5px solid var(--teal);cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.range input[type=range]::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--white);border:2.5px solid var(--teal);cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.range input[type=range]::-moz-range-track{background:transparent}
.range .track{position:absolute;left:9px;right:9px;top:16px;height:4px;border-radius:2px;background:var(--line)}
.range .fill{position:absolute;top:0;bottom:0;background:var(--teal);border-radius:2px}
.range .ticks{position:absolute;left:9px;right:9px;top:34px;display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--muted)}
.presets{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.presets .sep{display:none}
.presets .precis{display:inline-flex;align-items:center;gap:8px;margin-left:auto;padding-left:16px;border-left:1px solid var(--line)}
.preset{color:var(--ink);background:var(--teal-xl);padding:5px 12px;border-radius:5px;font-size:12px}
.preset:hover{color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.preset.on{background:var(--teal);color:#fff;font-weight:600}
.dtwrap{position:relative;display:inline-block}
.cal{position:absolute;left:0;top:calc(100% + 6px);z-index:20;background:var(--white);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px;width:248px;font-size:12.5px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.cal .ch button{padding:2px 8px;border-radius:4px;color:var(--teal);font-weight:600}
.cal .ch button:hover{background:var(--teal-xl)}
.cal .ch select{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--cream);color:var(--ink)}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .grid .wd{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 0}
.cal .grid button{padding:4px 0;border-radius:4px;font-size:12px;color:var(--ink)}
.cal .grid button:hover{background:var(--teal-xl)}
.cal .grid button.out{color:var(--line)}
.cal .grid button.sel{background:var(--teal);color:#fff;font-weight:600}
.cal .cf{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:var(--muted)}
.cal .cf button{color:var(--teal);font-weight:600}
.rlab{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--teal);font-weight:500;margin:0 6px 4px}
.adv .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.advCount{background:var(--teal);color:#fff;border-radius:10px;font-size:10px;padding:0 6px;font-family:"JetBrains Mono",monospace}
.advsum{max-width:1100px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 2px;font-size:12px}
@media (max-width:1100px){.fams{grid-template-columns:1fr 1fr}}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--white);color:var(--ink)}
.pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
.pill.x{padding-right:8px}
.tag{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 6px;border-radius:3px;border:1px solid currentColor;color:var(--c)}
.tile{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:block;color:inherit;text-align:left;width:100%}
a.tile:hover,button.tile:hover{text-decoration:none;border-color:var(--teal)}
.tile .tt{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.tile .ts{font-size:12.5px;color:var(--muted);margin-top:3px}
.tile .tn{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.codes .tile{display:flex;align-items:baseline;gap:8px;padding:8px 11px;border-radius:5px;border:1px solid transparent;background:transparent}
.codes .tile:hover{background:var(--teal-xl);border-color:var(--teal)}
.codes .cn{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codes .cs{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;margin-top:26px}
@media (max-width:1100px){.two,.grid3{grid-template-columns:1fr}}
.rec{display:flex;gap:12px;font-size:13px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.rec .d{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:11.5px;width:96px;flex:none}
.note{background:var(--warn-bg);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:12.5px}
.alert{background:var(--bad-bg);border:2px solid var(--bad);color:var(--ink);border-radius:6px;padding:12px 14px;font-size:13.5px;display:flex;gap:12px;align-items:flex-start}
.alert b{color:var(--bad)}
.ta{width:100%;background:var(--white);border:1.5px dashed var(--teal);border-radius:6px;padding:14px;min-height:160px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;border-radius:4px}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn:disabled{opacity:.5;cursor:default}

/* résultats */
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;font-size:12px}
.seg button{padding:4px 10px;color:var(--muted)}.seg button.on{background:var(--teal);color:#fff}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.item .t{font-family:"DM Serif Display",Georgia,serif;font-size:18px;margin:0 0 4px}
.item .t a{color:var(--ink)}.item .t a:hover{color:var(--teal)}
.item .sum{font-size:13.5px;margin:0 0 6px;max-width:80ch;white-space:pre-line}
.item .sum em{font-style:normal;background:var(--teal-xl);padding:0 2px}
.item .ref{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
.off{font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--teal);color:var(--teal);padding:1px 6px;border-radius:3px}
.warnp{font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);padding:1px 6px;border-radius:3px}
.facets{padding:2px 10px 6px 38px}
.facets .h5{padding:8px 0 2px}
.frow{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;width:100%;text-align:left;border-radius:4px}
.frow:hover{color:var(--teal)}.frow.on{color:var(--teal);font-weight:600}
.frow .n{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:11px;font-weight:400}
.hist{display:flex;align-items:flex-end;gap:2px;height:34px;margin:4px 0}
.hist i{flex:1;display:block;background:var(--teal);opacity:.3;min-height:1px}
.hist i.h{opacity:.9}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.src-state{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 4px}
.src-state span{display:inline-flex;align-items:center;gap:5px}
.src-state i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line)}
.src-state i.ok{background:var(--ok)}.src-state i.ko{background:var(--bad)}.src-state i.run{background:var(--warn)}

/* lecteur */
.reader{max-width:900px}
.reader pre{white-space:pre-wrap;font-family:"DM Sans",system-ui,sans-serif;font-size:14.5px;line-height:1.6;background:var(--white);border:1px solid var(--line);border-radius:6px;padding:20px 24px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:13px;margin:12px 0}
.kv b{color:var(--muted);font-weight:500}
.back{font-size:12.5px;margin-bottom:12px;display:inline-block}

/* article / filiation */
.tl{position:relative;margin:18px 0 0 10px;padding-left:22px;border-left:2px solid var(--line)}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev::before{content:"";position:absolute;left:-29px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--white);border:2px solid var(--teal)}
.tl .ev.bad::before{background:var(--bad);border-color:var(--bad)}
.tl .ev.soon::before{border-style:dashed;border-color:var(--muted)}
.tl .when{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted)}
.tl .what{font-weight:600;font-size:14px}
.tl .txt{font-size:13px;margin-top:4px;max-width:80ch;color:var(--ink)}
.tl .txt.clip{max-height:64px;overflow:hidden;position:relative}
.tl .txt.clip::after{content:"";position:absolute;inset:auto 0 0 0;height:28px;background:linear-gradient(transparent,var(--cream))}
.sim{font-family:"JetBrains Mono",monospace;font-size:11px}
.diff{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:18px 22px;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.diff del{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.diff ins{background:#dff0e3;color:var(--ok);text-decoration:none}
@media (prefers-color-scheme:dark){.diff ins{background:#1d3a28}}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--white);color:var(--ink)}
table.tb{border-collapse:collapse;font-size:13px;width:100%}
table.tb td,table.tb th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.tb th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.proto{position:fixed;right:12px;bottom:12px;font-size:11px;color:var(--muted);background:var(--white);border:1px solid var(--line);border-radius:4px;padding:4px 8px;z-index:9}
</style>

function route(){

    bindSearch(q => { const a = parseArticle(q); if (a) go(`#/article/${a.code}/${encodeURIComponent(a.num)}${$('#qdate').value?'?date='+$('#qdate').value:''}`); else $('#body').insertAdjacentHTML('afterbegin', `<div class="alert" style="margin-bottom:16px">⚠ <div>Je ne reconnais pas « ${esc(q)} » comme un article (<span class="mono">art. 1253 C. civ.</span>, <span class="mono">L. 1234-9 code du travail</span>). La recherche plein texte dans les lois n'est pas encore branchée sur le site.</div></div>`); });

  else if (s === 'travaux') {

/* La barre de l'accueil devine : article → fiche article ; sinon jurisprudence. */
function normaliser(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function parseArticle(q){
  const s = q.trim().toLowerCase().replace(/^art(icle|\.)?\s*/,'').replace(/\s+du\s+/,' ').replace(/\s+/g,' ');
  const m = /^((?:[lrd]\.?\s*)?[\d]+(?:-\d+)*(?:\s*[a-z]{0,2})?)\s+(.+)$/.exec(s);
  if (!m) return null;
  const num = m[1].replace(/\s+/g,'').replace(/^([lrd])\.?/, (x,l) => l.toUpperCase()+'. ').replace(/^([LRD])\. (\d)/, '$1$2').replace(/^([LRD])(\d)/,'$1. $2');
  const cname = m[2].replace(/[.,]$/,'').trim();
  for (const c of CODES) if (c[2].some(a => a.replace(/\.$/,'') === cname.replace(/\.$/,'')) || c[1].toLowerCase() === cname) return {code:c[0], num:num.replace('. ', '. ').replace(/^([LRD])\. /,'$1. ').replace(/^L\. /,'L').replace(/^R\. /,'R').replace(/^D\. /,'D'), label:c[1]};
  return null;
}
function smartGo(q){
  if (!q) return;
  const a = parseArticle(q);
  if (a) return go(`#/article/${a.code}/${encodeURIComponent(a.num)}`);
  go(jurisUrl(q));
}

const feed = {off:0, busy:false, fini:false, obs:null, hasard:false, exemple:false};
function initFeed(hasard){
  feed.off = 0; feed.busy = false; feed.fini = false; feed.hasard = !!hasard; feed.exemple = false;
  if ($('#feedCards')) $('#feedCards').innerHTML = '';
  if ($('#feedEnd')) $('#feedEnd').textContent = '';
  if ($('#feedSub')) $('#feedSub').textContent = 'les dernières décisions entrées en base';
  if (feed.obs) { feed.obs.disconnect(); feed.obs = null; }
  chargerFeed();
  feed.obs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) chargerFeed(); }, {rootMargin:'400px'});
  feed.obs.observe($('#feedEnd'));
}
function tirerExemple(n){
  const src = FEED_EXEMPLE.slice();
  for (let i = src.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [src[i], src[j]] = [src[j], src[i]]; }
  return src.slice(0, n);
}
function squelettes(n){ return Array.from({length:n}, () => `<div class="sk"><div style="width:40%"></div><div></div><div></div><div></div></div>`).join(''); }
async function chargerFeed(){
  if (feed.busy || feed.fini || !$('#feedCards')) return;
  feed.busy = true;
  const cards = $('#feedCards'); const end = $('#feedEnd');
  cards.insertAdjacentHTML('beforeend', `<div id="skel" style="display:contents">${squelettes(feed.off ? 4 : 8)}</div>`);
  try {
    let d;
    if (feed.exemple) { d = {results: tirerExemple(feed.off ? 12 : 24)}; }
    else {
      const r = await fetch(`${API}/api/recent?limit=${feed.off ? 12 : 24}&offset=${feed.off}${feed.hasard ? '&ordre=hasard' : ''}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      d = await r.json();
    }
    $('#skel')?.remove();
    const rows = d.results || [];
    if (!rows.length) { feed.fini = true; end.textContent = feed.off ? 'Fin du flux.' : 'Rien à afficher.'; return; }
    cards.insertAdjacentHTML('beforeend', rows.map(carte).join(''));
    feed.off += rows.length;

    if (rows.length < 12) { feed.fini = true; end.textContent = 'Fin du flux.'; }
  } catch(e) {
    $('#skel')?.remove();
    feed.busy = false;
    // Route absente : on montre l'allure du flux avec de vraies décisions déjà lues.
    feed.exemple = true;
    $('#feedSub').innerHTML = `<span class="warnp">aperçu</span> décisions réelles, en attendant la route « nouveautés »`;
    return chargerFeed();
  } finally { feed.busy = false; }
}
function carte(r){
  const fam = FAM(r); const f = FORMATION[r.formation] || r.formation || '';
  const officiel = !!r.sommaire;
  const txt = (r.sommaire || r.debut || r.extract || '').replace(/<(?!\/?em>)[^>]*>/g,'');
  return `<a class="card2" href="#/decision/${r.source}/${encodeURIComponent(r.id)}">
    <div class="top2"><span class="tag" style="--c:var(--${fam})">${FAMLABEL[fam]}</span><span class="qui">${esc(r.juridiction||'')}${f?' · '+esc(f):''}</span>${officiel?'<span class="off">sommaire officiel</span>':''}<span class="jour">${fmtDate(r.date)}</span></div>
    <div class="ttl">${esc(prettyTitre(r))}</div>
    ${txt ? `<div class="res">${txt}</div>` : ''}</a>`;
}
function prettyTitre(r){
  const t = String(r.title||'').replace(/\b(\d{4}-\d{2}-\d{2})\b/g, m => fmtDate(m));
  return t || `${r.juridiction||''} — n° ${r.numero||''}`;
}

/* ───────────────────────── recherche (appels réels) ───────────────────────── */
let searchSeq = 0;
async function runSearch(){
  const q = state.q; const seq = ++searchSeq;
  const adv = state.adv;
  const juris = (adv.juridiction||'').split(',').filter(j => JURI_SOURCES[j]);
  const plans = juris.length ? juris.map(j => ({sources: JURI_SOURCES[j], juridiction: j})) : [{sources:'dila'},{sources:'ariane'},{sources:'admin'},{sources:'cedh'},{sources:'cjue'}];
  state.results = []; state.srcState = {}; state.facet = {}; state.warnings = [];
  const b = $('#body');
  state.advOpen = false;
  const chips = fmtAdv(adv);
  b.innerHTML = `<div style="display:flex;gap:12px;align-items:center;margin:-8px 0 0">${searchBar('Mots-clés, numéro, ECLI…')}<a class="pill" href="#/suivre?q=${encodeURIComponent(q)}">${ico('bell')} Suivre</a></div><div class="advsum" id="advSum">${chips.map(c => `<button class="chip on x" data-rm="${c.k}:${c.v}">${esc(c.label)} ✕</button>`).join('')}<button class="chip add" id="advAdd">${chips.length?'+ modifier':'+ où, quelle chambre, quand'}</button></div><div id="srcState" class="src-state"></div><div id="topline"></div><div id="list"></div>`;
  bindSearch(nq => go(jurisUrl(nq)));
  $('#advAdd').onclick = () => $('#advT').click();
  document.querySelectorAll('[data-rm]').forEach(c => c.onclick = () => { const [k,v] = c.dataset.rm.split(':'); const a = {...adv}; if (k==='juridiction') { a.juridiction = a.juridiction.split(',').filter(x=>x!==v).join(','); if (!a.juridiction) delete a.juridiction; if (!a.juridiction?.split(',').includes('cass')) delete a.formation; } else if (k==='formation') delete a.formation; else { delete a.date_min; delete a.date_max; } go(jurisUrl(q, a)); });
  if (!q) { $('#list').innerHTML = `<p class="muted">Tapez quelque chose.</p>`; return; }
  const planKey = pl => pl.juridiction ? (JURI_LABEL[pl.juridiction]||pl.juridiction) : (SRC[pl.sources]||pl.sources);
  for (const pl of plans) state.srcState[planKey(pl)] = 'run';
  renderSrcState();
  await Promise.all(plans.map(async plan => {
    const params = new URLSearchParams({q, limit:'30', sources:plan.sources, timeout:'20'});
    if (plan.juridiction) params.set('juridiction', plan.juridiction);
    if (adv.formation && plan.juridiction === 'cass') params.set('formation', adv.formation);
    if (adv.date_min) params.set('date_min', adv.date_min);
    if (adv.date_max) params.set('date_max', adv.date_max);
    if (state.sort !== 'pertinence') params.set('sort', state.sort);
    try {
      const r = await fetch(`${API}/api/search?${params}`);
      const d = await r.json();
      if (seq !== searchSeq) return;
      if (d.error) { state.srcState[planKey(plan)] = 'ko:'+d.error; }
      else {
        state.srcState[planKey(plan)] = plan.sources.split(',').every(s => (d.sources_no_result||[]).includes(s)) ? 'ko:pas de réponse' : 'ok';
        (d.filtres_ignores||[]).forEach(f => state.warnings.push(f));
        const seen = new Set(state.results.map(x => x.source+':'+x.id));
        for (const x of d.results||[]) if (!seen.has(x.source+':'+x.id)) { seen.add(x.source+':'+x.id); state.results.push(x); }
        const ORDER = ['dila','ariane','admin','cedh','cjue'];
        if (state.sort === 'pertinence') state.results.sort((a,b) => ORDER.indexOf(a.source) - ORDER.indexOf(b.source));
        else state.results.sort((a,b) => state.sort === 'date_desc' ? (b.date||'').localeCompare(a.date||'') : (a.date||'').localeCompare(b.date||''));
      }
    } catch(e) { state.srcState[planKey(plan)] = 'ko:'+e.message; }
    renderSrcState(); renderRail(); renderResults();
  }));
}
function renderSrcState(){
  const el = $('#srcState'); if (!el) return;
  el.innerHTML = Object.entries(state.srcState).map(([s,v]) => `<span><i class="${v==='ok'?'ok':v==='run'?'run':'ko'}"></i>${esc(s)}${v.startsWith('ko:')?' · <em>'+esc(v.slice(3))+'</em>':''}${v==='run'?' <span class="spin"></span>':''}</span>`).join('');
}
function filtered(){
  return state.results.filter(r => (!state.facet.fam || FAM(r)===state.facet.fam) && (!state.facet.juri || r.juridiction===state.facet.juri) && (!state.facet.an || (r.date||'').slice(0,4)===state.facet.an) && (!state.facet.src || r.source===state.facet.src));
}
function renderFacets(){
  const rows = filtered(); const all = state.results;
  const count = (arr, f) => { const m = new Map(); for (const r of arr) { const k = f(r); if (k) m.set(k, (m.get(k)||0)+1); } return [...m].sort((a,b)=>b[1]-a[1]); };
  const years = count(all, r => (r.date||'').slice(0,4)).sort((a,b)=>a[0].localeCompare(b[0]));
  const max = Math.max(1, ...years.map(y=>y[1]));

const words = t => (t||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w => w.length > 2);
function jaccard(a, b){ const A = new Set(words(a)), B = new Set(words(b)); if (!A.size && !B.size) return 1; let i = 0; for (const w of A) if (B.has(w)) i++; return i / (A.size + B.size - i); }
function diffWords(a, b){
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  const n = A.length, m = B.length; const dp = Array.from({length:n+1}, () => new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0,j=0,out='';
  while (i<n && j<m) { if (A[i]===B[j]) { out += esc(A[i]); i++; j++; } else if (dp[i+1][j] >= dp[i][j+1]) { out += `<del>${esc(A[i])}</del>`; i++; } else { out += `<ins>${esc(B[j])}</ins>`; j++; } }
  while (i<n) out += `<del>${esc(A[i++])}</del>`; while (j<m) out += `<ins>${esc(B[j++])}</ins>`;
  return out;
}

    ${[['Open data TA/CAA','986 000 décisions','en base, moteur à brancher'],['CADA · Défenseur des droits','76 805 avis','MCP seulement, site en chantier 3'],['Rapporteurs publics','9 138 conclusions','servies nulle part'],['Conventions collectives','305 839 textes','titres et IDCC en cours de ré-ingestion'],['Travaux préparatoires','—','pas encore téléchargés']].map(([a,b2,c])=>`<div class="rec"><span class="d" style="width:220px">${a}</span><span class="mono" style="width:180px;flex:none;font-size:12px">${b2}</span><span class="muted">${c}</span></div>`).join('')}
    <div class="h5" style="margin-top:28px">Ce que la page ne fait jamais</div><div style="font-size:13px;line-height:1.7;max-width:80ch">Afficher un résumé généré sans l'étiquette « automatique ».<br>Faire passer un sommaire pour le texte intégral.<br>Dire « complet » sans le tableau ci-dessus.</div>`;
  }
}

/* étage 1 du vérificateur : repérer et résoudre, pour de vrai */
async function verifierCitations(){
  const txt = $('#memo').value; const out = $('#verifOut'); const lit = $('#litDate').value;
  const found = [];
  const reDec = /n[°º]\s*(\d{2}-\d{2}\.\d{3})/g; let m;
  while ((m = reDec.exec(txt))) found.push({type:'décision', ref:m[1], ctx: txt.slice(Math.max(0,m.index-60), m.index)});
  const reCE = /CE[^\n]{0,60}?n[°º]\s*(\d{5,6})/g;
  while ((m = reCE.exec(txt))) found.push({type:'décision', ref:m[1], ctx:'CE'});
  const reArt = /article\s+((?:[LRD]\.?\s*)?\d+(?:-\d+)*)\s+du\s+(code\s+[^,;.()]+?)(?=[,;.()]|\s+(?:tel|issu|permet|dispose|prévoit|dans))/gi;
  while ((m = reArt.exec(txt))) { const a = parseArticle(`art. ${m[1]} ${m[2].trim()}`); found.push({type:'article', ref:`art. ${m[1]} ${m[2].trim()}`, art:a}); }
  const reQ = /[«"“]\s*([^»"”]{25,400}?)\s*[»"”]/g;
  while ((m = reQ.exec(txt))) found.push({type:'passage', ref:m[1].trim()});
  if (!found.length) { out.innerHTML = `<p class="muted">Aucune référence ni passage entre guillemets reconnus (n° 04-10.362, n° 380374, article 1253 du code civil, « … »).</p>`; return; }
  out.innerHTML = `<table class="tb"><tr><th>Type</th><th>Référence</th><th>Résultat</th><th>Détail</th></tr>${found.map((f,i)=>`<tr id="v${i}"><td>${f.type}</td><td class="${f.type==='passage'?'':'mono'}" style="max-width:32ch">${f.type==='passage'?'« '+esc(f.ref.slice(0,90))+(f.ref.length>90?'…':'')+' »':esc(f.ref)}</td><td><span class="spin"></span></td><td></td></tr>`).join('')}</table>`;
  let next = 0;
  const worker = async () => { while (next < found.length) { const i = next++; await verifierLigne(found[i], i); } };
  const verifierLigne = async (f, i) => {
    const row = $(`#v${i}`); const cells = row.querySelectorAll('td');
    try {
      if (f.type === 'passage') {
        const norm = t => String(t||'').toLowerCase().replace(/<[^>]+>/g,'').replace(/[’']/g,"'").replace(/[^\p{L}\p{N}]+/gu,' ').trim();
        const needle = norm(f.ref);
        const arts = found.filter(x => x.type==='article' && x.art);
        let hit = null;
        for (const a of arts) {
          try { const r = await fetch(`${API}/api/law/versions?code=${a.art.code}&num=${encodeURIComponent(a.art.num)}`); const d = await r.json(); const v = (d.versions||[]).find(v => norm(v.texte).includes(needle)); if (v) { hit = {kind:'article', label:`${a.ref}, rédaction du ${fmtDate(v.date_debut)}${(v.date_fin||'2999')<'2999'?' au '+fmtDate(v.date_fin):''}`, href:`#/article/${a.art.code}/${encodeURIComponent(a.art.num)}?date=${v.date_debut}`}; break; } } catch(e){}
        }
        let maybe = [];
        if (!hit) {
          // tous les mots (la recherche « phrase » du site ne voit pas les sommaires), puis vérification mot pour mot dans la décision elle-même
          const words = f.ref.replace(/[«»"“”]/g,' ').split(/\s+/).filter(w => w.length > 3).slice(0, 12).join(' ');
          const r = await fetch(`${API}/api/search?q=${encodeURIComponent(words)}&limit=5&sources=dila&timeout=25`); const d = await r.json();
          const rows = d.results||[];
          for (const x of rows.slice(0,3)) {
            try { const rd = await fetch(`${API}/api/decision?source=${x.source}&id=${encodeURIComponent(x.id)}`); const dd = await rd.json(); if (norm(dd.full_text).includes(needle) || norm(dd.sommaire).includes(needle)) { hit = {kind:'décision', label:x.title, href:`#/decision/${x.source}/${encodeURIComponent(x.id)}`, date:x.date}; break; } } catch(e){}
          }
          if (!hit) maybe = rows.slice(0,3);
        }
        if (hit) { cells[2].innerHTML = `<span style="color:var(--ok);font-weight:600">correspond à</span>`; cells[3].innerHTML = `<a href="${hit.href}">${esc(hit.label)}</a>${hit.date?' · '+fmtDate(hit.date):''}`; }
        else if (maybe.length) { cells[2].innerHTML = `<span class="warnp">susceptible de correspondre à</span>`; cells[3].innerHTML = `<span class="muted">les mots y sont, pas la phrase telle quelle : </span>` + maybe.map(x => `<a href="#/decision/${x.source}/${encodeURIComponent(x.id)}">${esc(x.title)}</a>`).join(' · '); }
        else { cells[2].innerHTML = `<span style="color:var(--bad);font-weight:600">NON TROUVÉ</span>`; cells[3].innerHTML = `<span class="muted">ni dans les articles cités, ni mot pour mot dans la jurisprudence judiciaire</span>`; }
      } else if (f.type === 'décision') {
        const r = await fetch(`${API}/api/search?q=${encodeURIComponent(f.ref)}&limit=5&timeout=20${f.ctx==='CE'?'&sources=ariane,admin':'&sources=dila'}`); const d = await r.json();
        const norm = v => String(v||'').replace(/[\s.]/g,'');
        const hit = (d.results||[]).find(x => norm(x.numero) === norm(f.ref) || norm(x.title).includes(norm(f.ref)));
        if (hit) { cells[2].innerHTML = `<span style="color:var(--ok);font-weight:600">existe</span>`; cells[3].innerHTML = `<a href="#/decision/${hit.source}/${encodeURIComponent(hit.id)}">${esc(hit.title)}</a> · ${fmtDate(hit.date)}`; }
        else { cells[2].innerHTML = `<span style="color:var(--bad);font-weight:600">NON TROUVÉ</span>`; cells[3].innerHTML = `<span class="muted">aucune décision portant ce numéro dans ${f.ctx==='CE'?'ArianeWeb / justice administrative':'le fonds judiciaire'}</span>`; }
      } else {
        if (!f.art) { cells[2].innerHTML = `<span class="warnp">code inconnu</span>`; cells[3].textContent = 'ajouter ce code à la table des identifiants'; return; }
        const r = await fetch(`${API}/api/law/versions?code=${f.art.code}&num=${encodeURIComponent(f.art.num)}`); const d = await r.json();
        const vs = (d.versions||[]).sort((x,y)=>x.date_debut.localeCompare(y.date_debut));
        if (!vs.length) { cells[2].innerHTML = `<span style="color:var(--bad);font-weight:600">NON TROUVÉ</span>`; return; }
        const atLit = vs.find(v => v.date_debut <= lit && (v.date_fin||'2999') > lit);
        const cur = vs.find(v => (v.date_fin||'2999') > new Date().toISOString().slice(0,10));
        const recyc = atLit && cur && atLit !== cur && jaccard(atLit.texte, cur.texte) < 0.25;
        cells[2].innerHTML = recyc ? `<span style="color:var(--bad);font-weight:600">NUMÉRO RECYCLÉ</span>` : (atLit ? `<span style="color:var(--ok);font-weight:600">existe à la date</span>` : `<span class="warnp">inexistant au ${fmtDate(lit)}</span>`);
        const before = vs.filter(v => (v.date_fin||'2999') <= lit).at(-1), after = vs.find(v => v.date_debut > lit);
        cells[3].innerHTML = `${atLit ? `au ${fmtDate(lit)} : « ${esc((atLit.texte||'').slice(0,90))}… »` : (before ? `abrogé le ${fmtDate(before.date_fin)}${after ? `, recréé le ${fmtDate(after.date_debut)}${jaccard(before.texte, after.texte) < 0.25 ? ' <b>avec un autre texte</b>' : ''}` : ''}` : `n'existe que depuis le ${fmtDate(vs[0].date_debut)}`)}${recyc ? ` — <b>aujourd'hui, autre texte</b>` : ''} · <a href="#/article/${f.art.code}/${encodeURIComponent(f.art.num)}?date=${lit}">histoire →</a>`;
      }
    } catch(e) { cells[2].innerHTML = `<span class="warnp">erreur</span>`; cells[3].textContent = e.message; }
  };
  await Promise.all([worker(), worker(), worker()]);
}

route();
</script>
