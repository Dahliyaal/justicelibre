<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette 01 · Dossier · Art. 145 CPC</title>
<style>
:root{--teal:#1a4e4e;--teal-l:#2a6b6b;--teal-xl:#e8f0f0;--ink:#1a1a1a;--muted:#6b6b6b;--white:#fff;--line:#e0ddd6;--cream:#fdfcf8;--warn-bg:#fbf1dc;--warn:#8a5a12;--bad-bg:#fbe3e0;--bad:#8a2a1f;--ok:#1f6f4a;--ok-bg:#dff0e3;
 --jud:#2f5d8a;--adm:#7a5c1e;--ce:#1f6f4a;--eu:#6d3e8c;--txt:#8a4a1f;--doc:#4e5a8c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--teal:#4ea0a0;--teal-l:#66baba;--teal-xl:#1e3a3a;--ink:#e8e6df;--muted:#8a867d;--white:#1e1e1c;--line:#2a2a27;--cream:#1a1a1a;--warn-bg:#3a2e14;--warn:#e0b060;--bad-bg:#3d1c18;--bad:#f0a090;--ok:#6fc29a;--ok-bg:#1d3a28;--jud:#7fa6d6;--adm:#c9a55c;--ce:#6fc29a;--eu:#b98ad6;--txt:#d6905c;--doc:#93a0d6}}
:root[data-theme=dark]{--teal:#4ea0a0;--teal-l:#66baba;--teal-xl:#1e3a3a;--ink:#e8e6df;--muted:#8a867d;--white:#1e1e1c;--line:#2a2a27;--cream:#1a1a1a;--warn-bg:#3a2e14;--warn:#e0b060;--bad-bg:#3d1c18;--bad:#f0a090;--ok:#6fc29a;--ok-bg:#1d3a28;--jud:#7fa6d6;--adm:#c9a55c;--ce:#6fc29a;--eu:#b98ad6;--txt:#d6905c;--doc:#93a0d6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--cream)}
a{color:var(--teal);text-decoration:none}a:hover{color:var(--teal-l);text-decoration:underline}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.h5{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;border-bottom:1px solid var(--line);background:var(--white);position:sticky;top:0;z-index:5}
.logo{font-family:"DM Serif Display",Georgia,serif;font-size:20px;color:var(--teal)}
.logo span{color:var(--muted)}
.nav{display:flex;gap:22px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav a{color:inherit}.nav a.on{color:var(--teal);font-weight:600}
.app{display:flex;min-height:calc(100% - 56px)}
.rail{width:248px;flex:none;border-right:1px solid var(--line);background:var(--white);padding:10px 8px 12px;display:flex;flex-direction:column;gap:1px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;transition:width .15s}
.rail.mini{width:60px}
.rail.mini .lbl,.rail.mini .n,.rail.mini .sec{display:none}
.rail .hd{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;color:var(--muted)}
.rail .sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.ri{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--ink);width:100%;text-align:left}
.ri:hover{background:var(--cream);text-decoration:none}
.ri.on{background:var(--teal-xl);color:var(--teal);font-weight:600}
.ri svg{flex:none}
.ri .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);font-weight:400}
.body{flex:1;min-width:0;padding:32px 56px 80px}
@media (max-width:900px){.body{padding:20px 18px 80px}.rail{position:fixed;left:0;z-index:6;box-shadow:2px 0 12px rgba(0,0,0,.08)}.rail.mini{width:52px}.app{padding-left:52px}.rail:not(.mini){width:248px}}
.hero{font-family:"DM Serif Display",Georgia,serif;font-size:30px;margin:0 0 4px}
.lead{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:80ch}
.note{background:var(--warn-bg);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:12.5px}
.alert{background:var(--bad-bg);border:2px solid var(--bad);color:var(--ink);border-radius:6px;padding:12px 14px;font-size:13.5px;display:flex;gap:12px;align-items:flex-start}
.alert b{color:var(--bad)}
.warnp{font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);padding:1px 6px;border-radius:3px;white-space:nowrap}
.tag{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 6px;border-radius:3px;border:1px solid currentColor;color:var(--c)}
.back{font-size:12.5px;margin-bottom:12px;display:inline-block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.proto{position:fixed;right:12px;bottom:12px;font-size:11px;color:var(--muted);background:var(--white);border:1px solid var(--line);border-radius:4px;padding:4px 8px;z-index:9}
/* pastilles d'état, sources, rédactions : communs à toutes les maquettes */
.st{display:inline-flex;align-items:center;gap:5px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;padding:1px 8px 1px 6px;border-radius:10px;border:1px solid currentColor;white-space:nowrap;vertical-align:1px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st.ok{color:var(--ok)}.st.ab{color:var(--bad)}.st.q{color:var(--muted)}.st.q::before{background:transparent;border:1px solid currentColor;width:5px;height:5px}
.src{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:0 5px;border-radius:3px;white-space:nowrap}
.rd{display:inline-block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;padding:1px 7px;border-radius:3px;background:var(--teal-xl);color:var(--teal);white-space:nowrap}
.rd.old{background:var(--warn-bg);color:var(--warn);font-weight:600}
.nor{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.honest{font-size:12.5px;color:var(--muted);padding:8px 12px;border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:0 6px 6px 0}
.honest b{color:var(--ink)}
.dtin{padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--white);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
pre.json{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;line-height:1.45;max-height:460px;overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0;white-space:pre-wrap}
.alin{margin:0 0 .7em}.alin:last-child{margin-bottom:0}
.alin .no{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;color:var(--muted);margin-right:8px}
.notaBox{margin-top:12px;padding:9px 12px;background:var(--warn-bg);border-radius:6px;font-size:12.5px}
.notaBox b{color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:4px}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}

/* ── propre à la maquette ── */

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:36px;max-width:1240px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.toc{display:none}}
.band{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ok-bg);border:1px solid var(--ok);border-left:6px solid var(--ok);border-radius:6px;padding:12px 16px;margin:14px 0 22px;font-size:13.5px}
.band .big{font-weight:600;color:var(--ok);font-size:14px}
.band .sep{color:var(--line)}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:0;margin-bottom:20px;overflow:hidden}
.card>h2{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:19px;display:flex;align-items:baseline;gap:12px}
.card>h2 .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--teal);background:var(--teal-xl);padding:2px 8px;border-radius:4px}
.card>h2 .n{margin-left:auto;font-family:"DM Sans",system-ui,sans-serif;font-size:12px;color:var(--muted)}
.card .in{padding:14px 18px}
.card h3{margin:16px 0 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card h3:first-child{margin-top:0}
.lien{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.lien:first-of-type{border-top:0;padding-top:0}
.lien .rel{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--teal);padding-top:3px}
.lien .t a{font-weight:600;color:var(--ink)}.lien .t a:hover{color:var(--teal)}
.lien .d{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:3px}
.lien .x{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:90ch}
.vchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.vchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;color:var(--ink)}
.vchip.cur{border-color:var(--teal);background:var(--teal-xl)}
.vchip .mono{font-size:11px;color:var(--muted)}
details.fold{border:1px solid var(--line);border-radius:6px;background:var(--cream)}
details.fold summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:13.5px;user-select:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary .chev{width:18px;height:18px;border-radius:50%;border:1px solid var(--teal);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none;transition:transform .15s}
details.fold[open] summary .chev{transform:rotate(90deg)}
details.fold summary .res{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
details.fold[open] summary .res{display:none}
details.fold summary b{font-weight:600}
details.fold .body2{padding:4px 18px 16px 44px;font-size:14.5px;line-height:1.65;border-top:1px solid var(--line)}
.dec{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;padding:11px 0;border-top:1px solid var(--line)}
.dec:first-child{border-top:0;padding-top:0}
.dec .k{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.dec .t{font-family:"DM Serif Display",Georgia,serif;font-size:16px}
.dec .x{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.dec .ap{margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.toc{position:sticky;top:76px;align-self:start;font-size:13px}
.toc .h5{margin-bottom:8px}
.toc a{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-left:2px solid var(--line);color:var(--ink)}
.toc a:hover{border-color:var(--teal);color:var(--teal);text-decoration:none}
.toc a .n{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.toc .lu{margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--white);font-size:12px}
.toc .lu input{margin-top:6px;width:100%}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.kpi div{flex:1;min-width:140px;background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.kpi b{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:18px;font-weight:500}
.kpi span{font-size:11.5px;color:var(--muted)}

</style>
</head>
<body>
<div class="top">
  <div class="logo">justicelibre<span>.org</span></div>
  <div class="nav"><a href="../hub.html#/juris" class="on">Recherche</a><a href="https://justicelibre.org/mcp.html">MCP</a><a href="https://github.com/justicelibre">GitHub</a></div>
</div>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <main class="body" id="body"><p class="lead"><span class="spin"></span> Chargement de la carte…</p></main>
</div>
<div class="proto">maquette 01 · Dossier · <a href="index.html">les 8</a></div>
<script>

function render(M){
  const lien = x => `<div class="lien"><div class="rel">${esc(x.rel)}</div><div>
    <div class="t"><a href="${x.href}">${esc(x.titre)}</a>${x.long?` <span class="muted">· ${esc(x.long)}</span>`:''}</div>
    <div class="d">${x.date?`<span>${fmtDate(x.date)}</span>`:''}<span class="nor">NOR ${x.nor?esc(x.nor):'non renseigné'}</span>${pill(x.st)}${rdChip(x.v, M)}<a class="src" href="${x.lf}" title="source : LEGI, lien ${esc(x.l.typelien)}">LEGI ↗</a></div>
    ${x.extrait?`<div class="x">${esc(x.extrait)}</div>`:''}</div></div>`;
  const dec = x => `<div class="dec"><div class="k"><span class="tag" style="--c:var(--${x.fam})">${FAMLABEL[x.fam]}</span><span class="src">${esc(SRC[x.source])}</span><span class="mono">${fmtCourt(x.date)}</span></div><div>
    <div class="t"><a href="${x.href}">${esc(x.juridiction)}, n° ${esc(x.numero)}</a>${x.publication?` <span class="warnp" style="border-color:var(--muted);color:var(--muted)">${esc(x.publication)}</span>`:''}</div>
    <div class="ap">${x.v ? rdChip(x.v, M) : '<span class="st q">date hors de toute rédaction connue</span>'}${x.differs && x.v ? `<span class="warnp">rédaction antérieure à celle lue</span>` : ''}</div>
    <div class="x">« ${esc(x.extract)} »</div></div></div>`;
  const cur = M.cur;
  $('#body').innerHTML = `<a class="back" href="${HUB}#/textes">← Textes</a>
  <div class="wrap"><div>
    <p class="hero">Art. ${esc(M.num)} · ${esc(M.cname)}</p>
    <p class="lead" style="margin-bottom:0">Carte de l’article : d’où il vient, ce qu’il dit à la date lue, ce qui en dépend, qui le cite. <a href="${HUB}#/article/${M.code}/${M.num}">Page détaillée (diff mot à mot, histoire) →</a></p>
    <div class="band"><span class="big">${cur.etat.startsWith('VIGUEUR')?'En vigueur':esc(cur.etat)} depuis le ${fmtDate(cur.date_debut)}</span><span class="sep">|</span><span>${M.versions.length} rédactions depuis ${fmtDate(M.versions[0].date_debut)}</span><span class="sep">|</span><span>${M.recycled?'<span class="warnp">numéro recyclé</span>':'même objet depuis l’origine (pas de recyclage de numéro)'}</span><span class="sep">|</span><span>lu au <b class="mono">${fmtDate(M.at)}</b></span><span class="src" style="margin-left:auto">source : LEGI · ${esc(cur.legiarti)}</span></div>

    <section class="card" id="s1"><h2><span class="num">1</span>D’où il vient<span class="n">amont · ${M.amont.length} liens LEGI</span></h2><div class="in">${M.amont.map(lien).join('')}</div></section>

    <section class="card" id="s2"><h2><span class="num">2</span>Ce qu’il dit à la date lue<span class="n">${fmtDate(cur.date_debut)} → ${fmtDate(cur.date_fin)}</span></h2><div class="in">
      <div class="vchips">${M.versions.map((v,i)=>`<a class="vchip${v===cur?' cur':''}" href="?date=${v.date_debut}">${v===cur?'●':'○'} ${fmtDate(v.date_debut)} → ${fmtDate(v.date_fin)} <span class="mono">${esc(v.etat)}${M.sims[i]!==null?` · ${Math.round(M.sims[i]*100)} % de mots communs`:''}</span></a>`).join('')}</div>
      <details class="fold"><summary><span class="chev">▶</span><b>Texte intégral</b><span class="res">${M.alineas(cur).length} alinéas${cur.nota?' + Nota':''} · ${esc(M.resume(cur))}</span></summary><div class="body2">${texteHTML(cur, M)}</div></details>
      <div class="muted" style="font-size:12px;margin-top:8px">Source : <a href="https://www.legifrance.gouv.fr/codes/article_lc/${cur.legiarti}">Légifrance ${cur.legiarti}</a> · le Nota fait partie du texte.</div></div></section>

    <section class="card" id="s3"><h2><span class="num">3</span>Ce qui en dépend<span class="n">aval</span></h2><div class="in">
      <h3>Textes d’application</h3>${M.appli.length ? M.appli.map(lien).join('') : `<div class="honest">${HONEST(M.num)}</div>`}
      <h3>Textes qui le citent · ${M.citeTx.length}</h3>${M.citeTx.map(lien).join('')}
      ${M.cite.length?`<h3>Il cite · ${M.cite.length}</h3>${M.cite.map(lien).join('')}`:''}</div></section>

    <section class="card" id="s4"><h2><span class="num">4</span>Jurisprudence qui le cite<span class="n">${M.juri.length} décisions vérifiées</span></h2><div class="in">
      <div class="kpi"><div><b>${nb(M.C.total_lexical)}</b><span>pages contenant les deux expressions (recherche lexicale brute)</span></div>${Object.entries(M.C.per_source).map(([k,v])=>`<div><b>${nb(v)}</b><span>${esc(SRC[k]||k)}</span></div>`).join('')}</div>
      <div class="honest" style="margin-bottom:14px">${esc(M.C.avertissement)} Requête : <span class="mono">${esc(M.C.requete)}</span> · <a href="${M.searchHref}">tout voir →</a></div>
      ${M.juri.map(dec).join('')}
      <h3 style="margin-top:22px">Homonymes écartés · ${M.homos.length}</h3>
      ${M.homos.map(x=>`<div class="lien"><div class="rel" style="color:var(--bad)">écarté</div><div><div class="t"><a href="${x.href}" class="muted">${esc(x.juridiction)}, ${fmtCourt(x.date)}, ${esc(x.numero)}</a></div><div class="x">${esc(x.pourquoi)} <span class="src">${esc(SRC[x.source])}</span></div></div></div>`).join('')}</div></section>

    <section class="card" id="s5"><h2><span class="num">5</span>La même carte pour un LLM<span class="n">un seul appel MCP</span></h2><div class="in">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><button class="btn" id="jsonTog">Afficher le JSON</button><button class="btn ghost" id="jsonCopy">copier</button><span class="muted" style="font-size:12px">objet <span class="mono">carte_article</span> : mêmes champs, mêmes absences.</span></div>
      <pre class="json" id="jsonOut" hidden>${esc(JSON.stringify(M.objet, null, 1))}</pre></div></section>
  </div>
  <aside class="toc"><div class="h5">Sommaire</div>
    <a href="#s1">1 · D’où il vient<span class="n">${M.amont.length}</span></a><a href="#s2">2 · Texte à la date<span class="n">${M.versions.length} réd.</span></a><a href="#s3">3 · Ce qui en dépend<span class="n">${M.citeTx.length}</span></a><a href="#s4">4 · Jurisprudence<span class="n">${M.juri.length}</span></a><a href="#s5">5 · JSON</a>
    <div class="lu"><div class="h5">Lu à la date du</div><input type="date" id="atDate" class="dtin" value="${M.at}"><div class="muted" style="margin-top:6px">Changer la date recharge la carte avec la rédaction alors en vigueur.</div></div>
  </aside></div>`;
  $('#jsonTog').onclick = () => { const j = $('#jsonOut'); j.hidden = !j.hidden; $('#jsonTog').textContent = j.hidden ? 'Afficher le JSON' : 'Masquer le JSON'; };
  $('#jsonCopy').onclick = () => copyJson(M, $('#jsonCopy'));
}


/* ───── mécanique commune aux maquettes (copiée de hub.html) ───── */
{ const t = new URLSearchParams(location.search).get('theme'); let th = t;
  if (!th) { try { th = localStorage.getItem('hub-theme'); } catch {} }
  if (th === 'light' || th === 'dark') { document.documentElement.dataset.theme = th; try { localStorage.setItem('hub-theme', th); } catch {} }
  else if (t === 'system') { delete document.documentElement.dataset.theme; try { localStorage.removeItem('hub-theme'); } catch {} }
  else { document.documentElement.dataset.theme = 'dark'; } }
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

const REL = (l) => { const t = l.typelien, c = l.sens === 'cible';
  return ({CODIFICATION:'codifié par', TXT_SOURCE:'texte d’origine', CREATION:'crée', CREE:'créé par', MODIFIE: c?'modifié par':'modifie', MODIFICATION:'modifie',
    ABROGE: c?'abrogé par':'abroge', ABROGATION:'abroge', SPEC_APPLI:'texte d’application', TXT_ASSOCIE:'texte associé', CITATION: c?'cité par':'cite',
    CONCORDANCE:'concorde avec', CONCORDE:'concorde avec', TRANSFERT:'transféré vers', TRANSFERE:'transféré depuis', PEREMPTION:'périmé par', TRANSPOSITION:'transpose', PILOTE_SUIVEUR:'suit'})[t] || t.toLowerCase(); };
const AMONT = new Set(['CODIFICATION','TXT_SOURCE','CREATION','CREE','MODIFIE','ABROGE','TRANSFERE','CONCORDANCE','CONCORDE']);
const NAT = {DECRET:'décret', ARRETE:'arrêté', LOI:'loi', ORDONNANCE:'ordonnance', CODE:'code', DIRECTIVE_EURO:'directive UE'};
const SRC = {dila:'Judilibre · DILA', jade:'JADE · Conseil d’État', cedh:'HUDOC · Cour EDH', cjue:'CURIA · CJUE'};

function legifrance(l){ const id = l.id || l.cidtexte || '';

  if (id.startsWith('LEGIARTI')) return (l.naturetexte==='CODE' ? 'https://www.legifrance.gouv.fr/codes/article_lc/' : 'https://www.legifrance.gouv.fr/loda/article_lc/') + id;

  return 'https://www.legifrance.gouv.fr/'; }
async function loadModel(){

  const cname = versions[0].titre_text;

  const cur = versions.find(v => v.date_debut <= at && (v.date_fin||'2999') > at) || versions.at(-1);

    const e = (r.etat||'').toUpperCase(); if (!e) return null;

    if (e.startsWith('ABROG')) return {k:'ab', label:'abrogé' + (r.date_fin && r.date_fin < '2999' ? ' le ' + fmtCourt(r.date_fin) : ''), why:''};
    return {k:'q', label:e.toLowerCase(), why:''}; };
  const stLink = l => stOf(l.id) || stOf(l.cidtexte) || {k:'q', label:'non résolu', why:'identifiant absent de l’entrepôt'};

    return { l, v: x.v, rel: REL(l), nature: NAT[l.naturetexte] || (l.naturetexte||'').toLowerCase(), titre: l.libelle || l.id,

  const homos = (C.homonymes||[]).map(x => ({...x, href:`${HUB}#/decision/${x.source}/${encodeURIComponent(x.id)}`, fam: FAMOF[x.source]||'jud'}));

    textes_application:appli.map(x=>x.l), couverture_textes_application:{arretes_en_vigueur_avec_lien:313, arretes_en_vigueur:68811},
    cite:cite.map(x=>x.l), cite_par_textes:citeTx.map(x=>({relation:x.rel, ...x.l, etat_resolu:x.st.label})),
    cite_par_jurisprudence:{requete:C.requete, total_lexical:C.total_lexical, par_source:C.per_source, avertissement:C.avertissement,
      verifiees:juri.map(x=>({source:x.source, id:x.id, juridiction:x.juridiction, date:x.date, numero:x.numero, publication:x.publication||null, redaction_applicable:x.v?x.v.date_debut:null, extract:x.extract})), homonymes_ecartes:C.homonymes}};

  const resume = v => { const t = v.texte||''; return t.length > 120 ? t.slice(0, 117).replace(/\s+\S*$/, '') + '…' : t; };
  const searchHref = `${HUB}#/recherche?q=${encodeURIComponent('"article 145" "code de procédure civile"')}&scope=juris`;
  return {P, C, code, num, cname, versions, at, today, cur, sims, recycled, amont, appli, cite, citeTx, juri, homos, objet, alineas, resume, searchHref, res, stOf};
}
