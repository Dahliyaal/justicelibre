    CONCORDANCE:'concorde avec', CONCORDE:'concorde avec', TRANSFERT:'transféré vers', TRANSFERE:'transféré depuis', PEREMPTION:'périmé par', TRANSPOSITION:'transpose', PILOTE_SUIVEUR:'suit'})[t] || t.toLowerCase(); };
const ROOTS = new Set(['CODIFICATION','TXT_SOURCE','CREATION','CREE']);
const ACTS  = new Set(['MODIFIE','ABROGE','TRANSFERE','CONCORDANCE','CONCORDE']);
const SRC = {dila:'Judilibre · DILA', jade:'JADE · Conseil d’État', cedh:'HUDOC · Cour EDH', cjue:'CURIA · CJUE'};
const FAMOF = {dila:'jud', jade:'adm', cedh:'eu', cjue:'eu'};
const FAMLABEL = {jud:'judiciaire', adm:'administratif', eu:'européen'};
const NATLABEL = {DECRET:'décret', ARRETE:'arrêté', CODE:'code', LOI:'loi', ORDONNANCE:'ordonnance', DIRECTIVE_EURO:'directive UE'};
function legifrance(id, nature){ id = id || '';
  if (id.startsWith('JORFTEXT')) return `https://www.legifrance.gouv.fr/jorf/id/${id}`;
  if (id.startsWith('LEGIARTI')) return (nature==='CODE' ? 'https://www.legifrance.gouv.fr/codes/article_lc/' : 'https://www.legifrance.gouv.fr/loda/article_lc/') + id;
  if (id.startsWith('LEGITEXT')) return `https://www.legifrance.gouv.fr/loda/id/${id}`;
  return 'https://www.legifrance.gouv.fr/'; }
/* vivant / mort / futur à la date lue, d'après les bornes LEGI du texte */
function lifeAt(t, at){ if (!t) return {k:'q', label:'non résolu', why:'identifiant absent de l’entrepôt'};
  const d0 = t.date_debut || '0000', d1 = t.date_fin || '2999';
  if (d0 > at) return {k:'fut', label:`entre en vigueur le ${fmtCourt(d0)}`, why:'postérieur à la date lue'};
  if (d1 <= at) return {k:'ab', label:`${(t.etat||'').startsWith('PERIM')?'périmé':'abrogé'} le ${fmtCourt(d1)}`, why:'ne joue plus à la date lue'};
  return {k:'ok', label:'en vigueur', why:`depuis le ${fmtDate(d0)}` + ((t.etat||'')==='VIGUEUR_DIFF' ? ' (entrée en vigueur qui avait été différée par le texte modificateur)' : '')}; }
function pill(st){ return `<span class="st ${st.k}" title="${esc(st.why||'')}">${esc(st.label)}</span>`; }
function rdChip(v, cur){ return `<span class="rd${v===cur?'':' old'}" title="rédaction ${fmtDate(v.date_debut)} → ${fmtDate(v.date_fin)}">rédaction ${v.date_debut.slice(0,4)}${v===cur?' · lue':''}</span>`; }
const alineas = v => (v.texte||'').split(/(?<=\.)\s+(?=[A-Z])/);
const resume = v => { const t = v.texte||''; return t.length > 120 ? t.slice(0, 117).replace(/\s+\S*$/, '') + '…' : t; };
function texteHTML(v){ return alineas(v).map((a,i)=>`<p class="alin"><span class="no">al. ${i+1}</span>${esc(a)}</p>`).join('') + (v.nota ? `<div class="notaBox"><b>Nota.</b> ${esc(v.nota)}</div>` : ''); }
const titreArr = t => (t.titre_long && t.titre_long.length > (t.titre||'').length + 3) ? t.titre_long : (t.titre || t.legitext);
/* objet d'une chaîne : titre long de la tête, débarrassé de « Arrêté du … » */
const objetDe = t => { const s = titreArr(t); const m = /(?:relatif|relative|portant|fixant|modifiant|pris)\s.*$/i.exec(s); return m ? m[0].charAt(0).toUpperCase() + m[0].slice(1) : s; };

async function loadModel(){
  const get = async f => { const r = await fetch(f); if (!r.ok) throw new Error(`${f} : HTTP ${r.status}`); return r.json(); };
  const [P, C] = await Promise.all([get('../hub_paysage_748.json'), get('../hub_cite_748.json')]);
  const q = new URLSearchParams(location.search);
  const num = q.get('num') && P.articles[q.get('num')] ? q.get('num') : '748-6';
  const code = 'CPC';
  const versions = P.articles[num].slice().sort((x,y)=>x.date_debut.localeCompare(y.date_debut));
  const cname = versions[0].titre_text;
  const today = new Date().toISOString().slice(0,10); const at = q.get('date') || today;
  const cur = versions.find(v => v.date_debut <= at && (v.date_fin||'2999') > at) || (versions[0].date_debut > at ? null : versions.at(-1));
  const sims = versions.map((v,i) => i ? jaccard(versions[i-1].texte, v.texte) : null);
  const recycled = sims.some(s => s !== null && s < 0.25);
  const T = {...(P.resolus||{}), ...(P.arretes||{}), ...(P.decrets||{})};   // tous les textes connus, par LEGITEXT
  const tOf = l => (l.legitext_resolu && T[l.legitext_resolu]) || T[l.cidtexte] || T[l.id] || null;

  /* AMONT : ce qui a agi sur l'article, par rédaction ; anti-chrono ; racine en bas */
  const seen = new Set(); const acts = [], roots = [];
  for (const v of versions) for (const l of v.liens) {
    const k = l.typelien+'|'+l.sens+'|'+(l.legitext_resolu||l.id||l.cidtexte); if (seen.has(k)) continue; seen.add(k);
    const t = tOf(l);
    const item = { l, v, t, rel: REL(l), titre: l.libelle || l.id, long: t && titreArr(t) !== l.libelle ? titreArr(t) : '', date: l.datesignatexte && l.datesignatexte < '2999' ? l.datesignatexte : (t && t.date_texte) || '',
      nor: l.nortexte || (t && t.nor) || '', st: lifeAt(t, at), lf: legifrance(l.id || l.cidtexte, l.naturetexte), joue: v === cur, how: 'lien LEGI' };
    if (ROOTS.has(l.typelien)) { if (l.typelien==='CREATION'||l.typelien==='CREE') item.rel='créé par'; roots.push(item); } else if (ACTS.has(l.typelien) && l.sens === 'cible') acts.push(item);
  }
  acts.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const cite = versions.flatMap(v => v.liens.filter(l => l.typelien==='CITATION' && l.sens==='source').map(l => ({l, v, t: tOf(l), rel:'cite', titre:l.libelle||l.id, lf: legifrance(l.id||l.cidtexte, l.naturetexte), st: lifeAt(tOf(l), at), date: l.datesignatexte < '2999' ? l.datesignatexte : ''})));
  const seenC = new Set();
  const citeTx = versions.flatMap(v => v.liens.filter(l => l.typelien==='CITATION' && l.sens==='cible').map(l => ({l, t: tOf(l), rel:'cité par', titre:l.libelle||l.id, lf: legifrance(l.id||l.cidtexte, l.naturetexte), st: lifeAt(tOf(l), at), date: l.datesignatexte < '2999' ? l.datesignatexte : '', how:'lien LEGI'})))
    .filter(x => { const k = x.l.id || x.l.cidtexte; if (seenC.has(k)) return false; seenC.add(k); return true; })
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));

  /* AVAL : arrêtés qui visent l'article (par visa), fermés par succession (abroge / modifie) */
  const A = P.arretes || {};
  const direct = new Set(Object.keys(A).filter(k => (A[k].vise||[]).includes(num)));
  const adj = {}; for (const e of P.succession) { if (!(e.de in A) || !(e.vers in A)) continue; (adj[e.de] ||= new Set()).add(e.vers); (adj[e.vers] ||= new Set()).add(e.de); }
  const comp = {}; let cid = 0;
  for (const k of Object.keys(A)) { if (comp[k] !== undefined) continue; const stack = [k]; comp[k] = cid; while (stack.length) { const x = stack.pop(); for (const y of (adj[x]||[])) if (comp[y] === undefined) { comp[y] = cid; stack.push(y); } } cid++; }
  const keep = new Set(); for (const k of direct) for (const j of Object.keys(comp)) if (comp[j] === comp[k]) keep.add(j);
  const chains = {}; for (const k of keep) (chains[comp[k]] ||= []).push(A[k]);
  const succ = {}; for (const e of P.succession) { if (keep.has(e.de) && keep.has(e.vers)) { (succ[e.de] ||= []).push({vers:e.vers, type:e.type}); } }
  const chainList = Object.values(chains).map(members => {
    members.sort((a,b) => (b.date_texte||'').localeCompare(a.date_texte||''));
    const alive = members.filter(m => lifeAt(m, at).k === 'ok');
    const head = alive[0] || members.find(m => lifeAt(m, at).k !== 'fut') || members[0];
    return { members, head, alive, objet: objetDe(head), nbDirect: members.filter(m => direct.has(m.legitext)).length };
  }).sort((a,b) => (b.alive.length - a.alive.length) || (b.head.date_texte||'').localeCompare(a.head.date_texte||''));
  const decretsVisent = Object.values(P.decrets||{}).filter(d => (d.vise||[]).includes(num)).sort((a,b)=>(b.date_texte||'').localeCompare(a.date_texte||''));
  /* textes qui le citent : liens LEGI (CITATION cible) + visas des décrets, une ligne par TEXTE, groupées par nature */
  const citants = new Map();
  const addC = (key, o) => { if (!key) return; const e = citants.get(key); if (e) { if (o.arts) e.arts.push(...o.arts); e.how.add(o.how1); } else citants.set(key, {...o, arts:[...(o.arts||[])], how:new Set([o.how1])}); };
  for (const x of citeTx) { const l = x.l; const key = l.legitext_resolu || l.cidtexte || l.id; const t = x.t;
    const nature = l.naturetexte || (t && t.nature) || '?'; const artm = /- art\. ([^ (]+)/.exec(l.libelle||'');
    addC(key, {key, nature, titre: t ? titreArr(t) : (l.libelle||'').replace(/ - art\..*$/,''), date: (l.datesignatexte && l.datesignatexte < '2999') ? l.datesignatexte : (t && t.date_texte) || '', nor: l.nortexte || (t && t.nor) || '', t, arts: artm ? [artm[1]] : [], how1:'lien LEGI', lf: legifrance(key, nature)}); }
  for (const d of decretsVisent) addC(d.legitext, {key:d.legitext, nature:'DECRET', titre:titreArr(d), date:d.date_texte||'', nor:d.nor||'', t:d, arts:[], how1:'visa', lf: legifrance(d.legitext)});
  const NATORD = {DECRET:0, ARRETE:1, CODE:2, LOI:3, ORDONNANCE:4};
  const citantsList = [...citants.values()].map(c => ({...c, st: lifeAt(c.t, at), arts:[...new Set(c.arts)]})).sort((a,b) => ((NATORD[a.nature]??9)-(NATORD[b.nature]??9)) || (b.date||'').localeCompare(a.date||''));

  /* JURISPRUDENCE : fusion des doublons Judilibre / JURITEXT */
  const verAt = d => versions.find(v => v.date_debut <= d && (v.date_fin||'2999') > d);
  const byKey = new Map();
  for (const x of C.brut) { const k = x.date + '|' + x.juridiction + '|' + x.extract.slice(0, 60); const e = byKey.get(k);
    if (e) { e.ids.push(x.id); if (!e.title && x.title) e.title = x.title; } else byKey.set(k, {...x, ids:[x.id]}); }
  const juri = [...byKey.values()].map(x => { const v = verAt(x.date); const m = /n° ?([\d./-]+)|, (\d{5,7}),/.exec(x.title||''); const numero = m ? (m[1]||m[2]) : x.ids[0];
    return {...x, numero, v, differs: v !== cur, publication: /Publié/.test(x.title||'') ? 'Publié au recueil Lebon' : (/Inédit/.test(x.title||'') ? 'Inédit' : ''), href:`${HUB}#/decision/${x.source}/${encodeURIComponent(x.ids[0])}`, fam: FAMOF[x.source]||'jud'}; })
    .sort((a,b) => b.date.localeCompare(a.date));
  const fusion = C.brut.length - juri.length;

  const objet = { article:{code, num, legitext:versions[0].legitext}, lu_au: at,
    redactions: versions.map((v,i)=>({legiarti:v.legiarti, du:v.date_debut, au:v.date_fin, etat:v.etat, mots_communs_avec_precedente: sims[i]===null?null:Math.round(sims[i]*100), texte:v.texte, nota:v.nota||null})),
    recyclage: recycled,
    amont: { agit: acts.map(x=>({relation:x.rel, texte:x.titre, date:x.date, nor:x.nor, etat_a_la_date:x.st.label, joue_a_la_date:x.joue, redaction:x.v.date_debut, provenance:'lien LEGI de l’article'})),
             origine: roots.map(x=>({relation:x.rel, texte:x.titre, date:x.date, provenance:'lien LEGI de l’article'})) },
    aval: { chaines_d_arretes: chainList.map(c => ({objet:c.objet, tete: {nor:c.head.nor, date:c.head.date_texte, etat_a_la_date: lifeAt(c.head, at).label},
              membres: c.members.map(m => ({legitext:m.legitext, nor:m.nor, date:m.date_texte, du:m.date_debut, au:m.date_fin, etat_a_la_date: lifeAt(m, at).label, vise:m.vise, remplace_par:(succ[m.legitext]||[]).map(s=>({type:s.type, nor:A[s.vers].nor, date:A[s.vers].date_texte})), provenance: direct.has(m.legitext) ? 'visa (CITATION) vers l’article' : 'succession (abrogation / modification)'})) })),
            decrets_qui_visent: decretsVisent.map(d=>({nor:d.nor, date:d.date_texte, titre:titreArr(d), etat_a_la_date: lifeAt(d, at).label})),
            couverture: {arretes_en_vigueur_avec_lien_SPEC_APPLI:313, arretes_en_vigueur:68811, methode:'visas + successions'} },
    renvois_du_texte: cite.map(x=>x.l), textes_qui_le_citent: citantsList.map(c=>({nature:c.nature, texte:c.titre, articles:c.arts, date:c.date, nor:c.nor, etat_a_la_date:c.st.label, provenance:[...c.how]})),
    cite_par_jurisprudence: { requete:C.requete, total_lexical:C.total_lexical, par_source:C.per_source, avertissement:C.avertissement, doublons_fusionnes: fusion,
      decisions: juri.map(x=>({source:x.source, ids:x.ids, juridiction:x.juridiction, date:x.date, numero:x.numero, publication:x.publication||null, redaction_applicable:x.v?x.v.date_debut:null, extract:x.extract})) } };
  return {P, C, code, num, cname, versions, at, cur, sims, recycled, acts, roots, cite, citeTx, citantsList, chainList, succ, A, direct, decretsVisent, juri, fusion, objet};
}

  const chainHTML = (c, i) => { const hs = lifeAt(c.head, at); const dead = c.members.length - c.alive.length;
    return `<div class="chain${c.alive.length ? '' : ' '}" id="ch${i}"><div class="ch" onclick="this.parentElement.classList.toggle('open')"><span class="chev">▶</span><span class="obj" title="${esc(c.objet)}">${esc(c.objet)}</span><span class="cnt">${c.alive.length} vivant${c.alive.length>1?'s':''} · ${dead} mort${dead>1?'s':''}</span></div>

      <div class="members">${c.members.filter(m => m !== c.head).map(memHTML).join('') || '<div class="muted" style="padding:6px 0;font-size:12px">chaîne à un seul membre</div>'}</div></div>`; };

      <div class="legend"><span><i style="background:var(--ok)"></i>vivant à la date lue</span><span><i style="background:var(--muted)"></i>mort</span><span><i style="background:var(--doc)"></i>pas encore en vigueur</span></div>
      ${M.chainList.map(chainHTML).join('') || `<div class="honest">Aucun arrêté ne vise l’article ${esc(M.num)} dans LEGI.</div>`}
      <div class="honest" style="margin-top:10px">Chaînes construites à partir des <b>visas</b> (« Vu … l’article ${esc(M.num)} ») puis fermées par les liens d’<b>abrogation</b> et de <b>modification</b> entre arrêtés. LEGI ne porte presque jamais le lien typé « texte d’application » (313 arrêtés en vigueur sur 68 811) : un arrêté sans visa explicite n’apparaît pas ici, et son absence ne prouve rien.</div>
      ${M.citantsList.length ? `<div class="h5" style="margin:16px 0 6px">Textes qui le citent · ${M.citantsList.length}</div>${M.citantsList.map(c => `<div class="it${c.st.k!=='ok'?' dead':''}"><div class="rel">${esc((NATLABEL[c.nature]||c.nature.toLowerCase()))}${[...c.how].map(h=>`<span class="how">${esc(h)}</span>`).join('')}</div><div class="t"><a href="${c.lf}">${esc(c.titre)}</a>${c.arts.length?` <span class="muted">· art. ${esc(c.arts.join(', '))}</span>`:''}</div><div class="d">${c.date?`<span>${fmtCourt(c.date)}</span>`:''}${c.nor?`<span class="nor">${esc(c.nor)}</span>`:''}${pill(c.st)}</div></div>`).join('')}` : ''}</div>
  </div>
  <div class="juris"><h2>Jurisprudence qui le cite <span class="n">${M.juri.length} décisions · ${nb(M.C.total_lexical)} pages lexicales brutes · ${M.fusion} doublon${M.fusion>1?'s':''} fusionné${M.fusion>1?'s':''}</span></h2>
    <div class="honest">${esc(M.C.avertissement)} Requête : <span class="mono">${esc(M.C.requete)}</span> · ${Object.entries(M.C.per_source).map(([k,v])=>`${esc(SRC[k])} ${nb(v)}`).join(' · ')}</div>
    <div class="jgrid">${M.juri.map(x=>`<div class="jc${x.differs&&x.v?' old':''}" style="--c:var(--${x.fam})"><div class="m"><span class="tag" style="--c:var(--${x.fam})">${FAMLABEL[x.fam]}</span><span class="src">${esc(SRC[x.source])}</span><span class="mono">${fmtCourt(x.date)}</span>${x.ids.length>1?`<span class="how" title="${esc(x.ids.join(' · '))}">${x.ids.length} clés</span>`:''}</div><div class="t"><a href="${x.href}">${esc(x.juridiction)}, n° ${esc(x.numero)}</a></div><div class="x">« ${esc(x.extract)} »</div><div class="ap">${x.publication?`<span class="warnp" style="border-color:var(--muted);color:var(--muted)">${esc(x.publication)}</span>`:''}${x.v?rdChip(x.v, cur):'<span class="st q">hors rédaction connue</span>'}${x.differs&&x.v?'<span class="warnp">rédaction différente de celle lue</span>':''}</div></div>`).join('')}</div>
  </div>
  <div class="bottom"><div class="card"><h3>La même carte pour un LLM</h3><div style="display:flex;gap:10px;margin-bottom:8px"><button class="btn" id="jsonTog">Afficher le JSON</button><button class="btn ghost" id="jsonCopy">copier</button></div><pre class="json" id="jsonOut" hidden>${esc(JSON.stringify(M.objet, null, 1))}</pre></div></div>`;
  if ($('#rt')) $('#rt').onclick = () => { $('#rt').classList.toggle('open'); $('#rx').classList.toggle('open'); };
  $('#jsonTog').onclick = () => { const j = $('#jsonOut'); j.hidden = !j.hidden; $('#jsonTog').textContent = j.hidden ? 'Afficher le JSON' : 'Masquer le JSON'; };
  $('#jsonCopy').onclick = () => { try { navigator.clipboard.writeText(JSON.stringify(M.objet, null, 1)).then(() => { $('#jsonCopy').textContent = 'copié'; setTimeout(() => $('#jsonCopy').textContent = 'copier', 1500); }); } catch { $('#jsonCopy').textContent = 'copie impossible'; } };
  $('#atDate').onchange = e => { const q = new URLSearchParams(location.search); q.set('date', e.target.value); q.set('num', M.num); location.search = q.toString(); };
  $('#numSel').onchange = e => { const q = new URLSearchParams(location.search); q.set('num', e.target.value); location.search = q.toString(); };
}
renderRail();
loadModel().then(M => { window.M = M; render(M); }).catch(e => { $('#body').innerHTML = `<div class="alert">⚠ <div><b>Chargement impossible.</b> ${esc(e.message)}</div></div>`; console.error(e); });
</script>
</body>
</html>
