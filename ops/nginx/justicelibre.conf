server {
    server_name justicelibre.org www.justicelibre.org;

    root /var/www/justicelibre;
    index index.html;

    # Per-IP connection cap + rate limit applied to everything
    limit_conn justicelibre_conn 50;
    limit_req zone=justicelibre_rl burst=20 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    # 17 sept. 2026 : aspirateurs SEO commerciaux (Ahrefs 29 529 pages sur 50 000,
    # Semrush) saturaient l entrepot via le prechauffage des articles des pages
    # /decision/. Aucun visiteur n en vient. Google, Bing, Yandex, DuckDuckGo passent.
    if ($http_user_agent ~* "(AhrefsBot|SemrushBot|MJ12bot|DotBot|DataForSeoBot)") {
        return 403;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # robots.txt served from disk, never cached by middleboxes
    location = /robots.txt {
        add_header Cache-Control "public, max-age=300" always;
        try_files /robots.txt =404;
    }

    # Landing page
    location = / {
        try_files /index.html =404;
    }

    # MCP endpoint — proxy to FastMCP streamable-http
    # Token exchange endpoint for PISTE credentials
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mcp {
        # Never show up in search engines
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://127.0.0.1:8765/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP needs long keep-alive, no buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }


    # SSR pages — proxied to token_server (returns HTML/XML)
    location ~ ^/(decision/|loi/|sitemap[\w.\-]*\.xml$) {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect /search.html?id=X&source=Y → /decision/{source}/{id} canonique SSR
    # Permet aux LLM/crawlers de fetch directement la décision (au lieu du SPA vide)
    location = /search.html {
        if ($arg_id != "") {
            return 302 /decision/$arg_source/$arg_id;
        }
        try_files $uri =404;
    }

    # Everything else -> 404
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/justicelibre.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/justicelibre.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.justicelibre.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = justicelibre.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name justicelibre.org www.justicelibre.org;
    return 404; # managed by Certbot




}