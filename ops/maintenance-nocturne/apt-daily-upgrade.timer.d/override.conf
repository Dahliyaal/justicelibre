# /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
# Fenêtre nocturne pour unattended-upgrades (audit du 2 oct. 2026, P3).
# Par défaut : 06:00 UTC + jusqu'à 60 min aléatoires, en pleine montée du
# trafic. Creux mesuré : ~1 000 req/h vers 01-03 h UTC contre 6 000 à 10 h.
[Timer]
OnCalendar=
OnCalendar=*-*-* 02:30
RandomizedDelaySec=
RandomizedDelaySec=20m
