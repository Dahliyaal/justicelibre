# /etc/systemd/system/justicelibre.service.d/arret-rapide.conf
# La coupure du 2/10 (06:49:14 -> 06:50:44) n'était PAS le temps de
# redémarrage : uvicorn attend la fermeture des flux SSE ouverts
# (« Waiting for connections to close »), ne sort jamais, et systemd le tue au
# bout de TimeoutStopSec par défaut = 90 s (journal : « State 'stop-sigterm'
# timed out. Killing. »). Le nouveau processus démarre en 2 s.
# Plafonner l'attente ramène chaque redémarrage (unattended-upgrades, déploiement,
# restart manuel) à ~10 s au lieu de 90 s.
[Service]
TimeoutStopSec=8s
