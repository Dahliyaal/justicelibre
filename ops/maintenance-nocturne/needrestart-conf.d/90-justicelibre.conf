# /etc/needrestart/conf.d/90-justicelibre.conf   (OPTIONNEL, voir README)
# Ne PAS redémarrer automatiquement les services du site quand une
# bibliothèque est mise à jour : needrestart les liste seulement, et
# l'opératrice les redémarre elle-même (ou le script nocturne du README).
# Contrepartie : un correctif de sécurité de libssl n'est pris en compte par
# nginx / le MCP qu'au prochain redémarrage manuel.
$nrconf{override_rc}{qr(^justicelibre)} = 0;
$nrconf{override_rc}{qr(^nginx)} = 0;
